name: 대시보드 빌드
on:
  push:
    paths: ['input/**', 'data/**', 'templates/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas openpyxl
      - run: python scripts/build.py
      - name: 결과 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html atomy b2b
          git diff --cached --quiet || (git commit -m "대시보드 갱신" && git pull --rebase && git push)
