<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>애터미 매출 대시보드</title><meta name="robots" content="noindex"></head><body><!--BODY-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>/* 레이아웃: 상단 고정 바(기간·필터·탭) → 당월 진행률 → 요약 카드 → 월별 막대 → 표. 행을 누르면 오른쪽 서랍 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#f7f9fb; --fg:#16202c; --muted:#5d6978; --faint:#8a95a3; --line:#e1e6ed;
  --accent:#1f4f9c; --accent-soft:#e6eefb; --ghost:#c9d3e0; --on-accent:#ffffff;
  --up:#d1343f; --down:#2563c9; --warn:#c77700; --bad:#c62f3a; --ok:#178a5a;
  --chip:#eef1f5; --shadow:0 1px 2px rgba(22,32,44,.06);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#171e27; --panel2:#1c2430; --fg:#e7ecf2; --muted:#a2adbb; --faint:#768293; --line:#2a3441;
  --accent:#7aa6ec; --accent-soft:#1d2c44; --ghost:#34414f; --on-accent:#0f141b;
  --up:#ff6b72; --down:#6ea2ff; --warn:#f0a640; --bad:#ff6b72; --ok:#4cc58f;
  --chip:#222c38; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#171e27; --panel2:#1c2430; --fg:#e7ecf2; --muted:#a2adbb; --faint:#768293; --line:#2a3441;
  --accent:#7aa6ec; --accent-soft:#1d2c44; --ghost:#34414f; --on-accent:#0f141b;
  --up:#ff6b72; --down:#6ea2ff; --warn:#f0a640; --bad:#ff6b72; --ok:#4cc58f;
  --chip:#222c38; --shadow:none; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
#ctl{display:flex;flex-direction:column;gap:6px}
.titlerow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.titlerow h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.titlerow .meta{color:var(--muted);font-size:13px}
.titlerow .meta b{color:var(--fg);font-weight:600}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .lab{font-size:12px;color:var(--faint);width:44px;flex:none}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1.4}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.x{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
main.wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.panel>h2{font-size:15px;font-weight:600;margin:0;padding:14px 16px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h2 .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.panel>h2 .right{margin-left:auto;display:flex;gap:4px}
.pb{padding:12px 16px 16px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.card:hover{border-color:var(--faint)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.static{cursor:default}.card.static:hover{border-color:var(--line)}
.card .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .v{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.25}
.card.big .v{font-size:26px}
.card .d{font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;gap:6px;flex-wrap:wrap}
.card .bar{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.mini .v{font-size:19px}
/* 진행률 */
.prog{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;padding:12px 16px 16px}
.prog .nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;align-content:start}
.prog .nums small{display:block;color:var(--muted);font-size:12.5px}
.prog .nums b{font-size:20px;font-variant-numeric:tabular-nums}
.prog .nums .hero b{font-size:28px}
.prog .nums .hero b.ly{color:var(--muted)}
.prog .nums .hero .dx{font-size:14px;font-weight:600}
.mini3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini3 small{display:block;color:var(--muted);font-size:12.5px}
.mini3 b{font-size:18px;font-variant-numeric:tabular-nums}
.donut{display:flex;flex-direction:column;gap:10px;min-width:0}
.donut .dh2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.donut .dt{font-size:13px;font-weight:600;color:var(--muted)}
.dbody{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:center}
.dsvg{width:180px;height:180px;display:block}
.dleg{display:flex;flex-direction:column;gap:2px;min-width:0}
.dleg .dr{display:grid;grid-template-columns:10px minmax(0,1fr) 40px 64px 64px;gap:8px;align-items:center;font-size:13px;padding:4px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.dleg .dr.click{cursor:pointer}.dleg .dr.click:hover{background:var(--panel2)}
.dleg .dr.on{background:var(--accent-soft)}
.dleg i{width:10px;height:10px;border-radius:2px}
.dleg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg .pc,.dleg .av,.dleg .dx{text-align:right;white-space:nowrap}
.dleg .pc{color:var(--muted)}.dleg .dx{font-size:12px}
.spark{width:130px;height:30px;display:block}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap}
.st-ok{color:var(--ok)}
.t td.w{white-space:normal;min-width:220px;max-width:340px;color:var(--muted);font-size:12.5px}
.t td.w2{max-width:260px;color:var(--muted);font-weight:400;font-size:12.5px}
.lostsum{display:flex;gap:28px;flex-wrap:wrap;padding:12px 16px 0}
.lostsum small{display:block;color:var(--muted);font-size:12.5px}
.lostsum b{font-size:22px;font-variant-numeric:tabular-nums}
.lostsum span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pbar{position:relative;height:16px;background:var(--chip);border-radius:8px;margin:20px 0 22px;grid-column:1/-1}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:8px}
.pbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);text-decoration:none}
.pbar u span{position:absolute;top:22px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);white-space:nowrap}
.pbar em{position:absolute;right:0;top:-19px;font-size:11.5px;color:var(--muted);font-style:normal;white-space:nowrap}
.pbar u.ly{background:var(--warn);width:4px;margin-left:-2px;top:-6px;bottom:-6px;border-radius:2px}
.pbar u.ly span{color:var(--warn);font-weight:700;top:24px}
.callout{grid-column:1/-1;font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:8px 10px}
.prog .nums .callout b{color:var(--fg);font-size:inherit}
/* 차트 */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar-g.click{cursor:pointer}
.chart .bar-g:hover .cur{opacity:.85}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip .t{font-weight:600;margin-bottom:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:8px 16px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* 표 */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px 0}
.tools input,.tools select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--fg);font:inherit;font-size:13px;min-width:0}
.tools input{width:200px;max-width:100%}
.tw{overflow:auto;margin:10px 0 0;border-top:1px solid var(--line)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.t th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1;font-size:12.5px}
.t th.n,.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.t th .ar{color:var(--accent);margin-left:2px}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--panel2)}
.t td.name{max-width:280px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.t td.rk{color:var(--faint);width:28px}
.t tr.sum td{font-weight:600;background:var(--panel2)}
.t tr.on td{background:var(--accent-soft)}
.share{display:inline-block;width:44px;height:5px;background:var(--chip);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.st-new{color:var(--accent)} .st-up{color:var(--up)} .st-keep{color:var(--muted)} .st-down{color:var(--down)} .st-risk{color:var(--bad)} .st-late{color:var(--warn)} .st-dorm{color:var(--faint)}
.empty{color:var(--muted);padding:28px 16px;text-align:center}
.note{font-size:12.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--faint);line-height:1.6}
.hbar{display:flex;flex-direction:column;gap:4px}
.hbar .hr{display:grid;grid-template-columns:120px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:13px;cursor:pointer;padding:3px 4px;border-radius:6px}
.hbar .hr:hover{background:var(--panel2)}
.hbar .hr.on{background:var(--accent-soft)}
.hbar .tr{height:14px;background:var(--chip);border-radius:3px;overflow:hidden;position:relative}
.hbar .tr i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hbar .tr s{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.55}
.hbar .vv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
/* 달력 */
.cal-back{position:fixed;inset:0;background:rgba(10,15,22,.35);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:80px 16px 16px}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:16px;display:flex;flex-direction:column;gap:12px;max-width:100%}
.cal .qs{display:flex;gap:6px;flex-wrap:wrap;max-width:560px}
.cal .ms{display:flex;gap:24px;flex-wrap:wrap}
.cal .m h4{margin:0 0 6px;font-size:14px;text-align:center;cursor:pointer;color:var(--accent)}
.cal .m h4:hover{text-decoration:underline}
.cal .gd{display:grid;grid-template-columns:repeat(7,36px);gap:2px;font-size:13px;text-align:center}
.cal .gd .w{color:var(--faint);font-size:11.5px}
.cal .gd button{border:0;background:none;height:32px;border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.cal .gd button:hover{background:var(--chip)}
.cal .gd button.in{background:var(--accent-soft)}
.cal .gd button.edge{background:var(--accent);color:var(--on-accent)}
.cal .gd button:disabled{color:var(--faint);opacity:.4;cursor:default;background:none}
.cal .nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal .nav button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:2px 10px;cursor:pointer}
.cal .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* 서랍 */
.dr-back{position:fixed;inset:0;background:rgba(10,15,22,.3);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:31;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:14px}
.drawer .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer h3{margin:0;font-size:18px}
.drawer .x{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:16px}
.stats6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats6 div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.stats6 small{display:block;color:var(--muted);font-size:12px}
.stats6 b{font-size:16px;font-variant-numeric:tabular-nums}
details.panel summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px}
details.panel[open] summary{border-bottom:1px solid var(--line)}
details.panel .tw{margin:0;border-top:0}
@media (max-width:1100px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.prog{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  header.top{position:static}
  .row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .row .lab{display:none}
  .grid5,.grid4,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card .v{font-size:19px}.card.big .v{font-size:22px}
  .stats6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .t td.name{max-width:150px;position:sticky;left:0;background:var(--panel);z-index:0}
  .hbar .hr{grid-template-columns:80px minmax(0,1fr) 110px}
  .cal .gd{grid-template-columns:repeat(7,minmax(30px,1fr))}
  .cal .m:nth-child(2){display:none}
  .prog .nums .hero b{font-size:22px}
  .mini3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dbody{grid-template-columns:minmax(0,1fr)}
  .dsvg{margin:0 auto;width:160px;height:160px}
  .dleg .dr{grid-template-columns:10px minmax(0,1fr) 34px 56px 58px;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.fsum{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px 0;font-size:13px;color:var(--muted)}
.fsum b{font-size:15px;font-variant-numeric:tabular-nums}
.tbtns{margin-left:auto;display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--fg);text-decoration:none;white-space:nowrap}
.tbtn:hover{border-color:var(--faint)}
.siglegend{margin:10px 16px 0;padding:10px 12px;background:var(--panel2);border-radius:8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.siglegend .lr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:start}
.siglegend .lr b{color:var(--fg);font-weight:600}
.siglegend .lgi{display:flex;flex-wrap:wrap;gap:6px 16px}
.siglegend .li{display:inline-flex;align-items:center;gap:6px}
.lock .lockrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lock input{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--fg);font:inherit;width:200px;max-width:100%}
.pline{font-size:13px}
.selpanel{border-color:var(--accent)}
.pwrap{display:flex;flex-direction:column;gap:16px}
.loss{color:var(--bad);font-weight:600}
.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;padding:12px 16px 0}
.flow .fstep{background:var(--panel2);border-radius:8px;padding:6px 10px;min-width:92px}
.flow .fstep small{display:block;color:var(--muted);font-size:11.5px}
.flow .fstep b{font-size:15px;font-variant-numeric:tabular-nums}
.flow .fstep.minus b{color:var(--muted)}
.flow .fstep.neg{background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.flow .arr{align-self:center;color:var(--faint);font-weight:700}
.tips{margin:12px 16px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.tips ul{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.tips .tk{display:inline-block;min-width:36px;margin-right:8px;font-size:11.5px;font-weight:600;color:var(--accent)}
.legend-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:-8px}
</style>
<header class="top"><div class="wrap">
  <div class="titlerow"><h1 id="ttl">애터미 매출 대시보드</h1><span class="meta" id="meta"></span></div>
  <div id="ctl"></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>

<script>// ── 입장 비밀번호 (메인·애터미·B2B 공통). 맞으면 이 브라우저에 30일 기억.
// 손익 데이터 복호화에도 같은 비밀번호를 쓴다. chk = 'ok'를 암호화한 값(scripts/profit_pack.py).
const GATE=(()=>{const KEY='mcgate',DAYS=30;
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function dec(e,pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct))))}
  function saved(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.exp>Date.now())return o.pw}catch(x){}try{return sessionStorage.getItem(KEY)}catch(x){}return null}
  function save(pw){try{localStorage.setItem(KEY,JSON.stringify({pw,exp:Date.now()+DAYS*864e5}))}catch(x){}try{sessionStorage.setItem(KEY,pw)}catch(x){}}
  function clear(){try{localStorage.removeItem(KEY)}catch(x){}try{sessionStorage.removeItem(KEY)}catch(x){}}
  async function ok(chk,pw){if(!pw)return false;if(!chk)return true;try{await dec(chk,pw);return true}catch(x){return false}}
  function show(chk,done){const st=document.createElement('style');st.textContent=`
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:#f3f5f8;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#16202c}
#gate form{background:#fff;border:1px solid #e1e6ed;border-radius:12px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
#gate h2{margin:0 0 4px;font-size:18px}#gate p{margin:0 0 16px;color:#5d6978;font-size:13px}
#gate input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #cfd6df;border-radius:8px;font:inherit;font-size:15px;background:#fff;color:inherit}
#gate button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:#1f4f9c;color:#fff;font:inherit;font-weight:600;cursor:pointer}
#gate .m{min-height:18px;margin-top:8px;font-size:13px;color:#c0392b}
@media (prefers-color-scheme:dark){#gate{background:#0f141b;color:#e7ecf2}#gate form{background:#171e27;border-color:#2a3441}#gate p{color:#a2adbb}#gate input{background:#0f141b;border-color:#2a3441}#gate button{background:#3d6fc4}}`;
    document.head.append(st);const g=document.createElement('div');g.id='gate';
    g.innerHTML='<form autocomplete="off"><h2>기업영업팀 대시보드</h2><p>내부용 페이지입니다. 비밀번호를 입력하세요.</p><input type="password" placeholder="비밀번호" aria-label="비밀번호"><button type="submit">확인</button><div class="m"></div></form>';
    document.body.append(g);const inp=g.querySelector('input'),m=g.querySelector('.m');setTimeout(()=>inp.focus(),50);
    g.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();m.textContent='확인 중…';const pw=inp.value;
      if(await ok(chk,pw)){save(pw);g.remove();st.remove();done(pw)}else{m.textContent='비밀번호가 맞지 않습니다.';inp.select()}})}
  async function run(chk,done){const pw=saved();if(await ok(chk,pw)){save(pw);done(pw);return}clear();show(chk,done)}
  return{run,dec,saved,clear}})();
// 공통: 데이터 풀기, 날짜·숫자, 상단 컨트롤, 막대그래프, 표, 달력, 서랍, 기간 실적·원형도표, 상위 10·영업 액션·매출 감소 현황
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const MAX=D.meta.base, MIN=D.meta.min;
const R=D.rows.map(r=>({d:D.dates[r[0]],t:D.types[r[1]],c:r[2],s:r[3],i:r[4],p:D.reps[r[5]],x:D.exps[r[6]],doc:r[7],q:r[8],a:r[9]}));
const STAFF=D.meta.staff||[];
const curRep=c=>D.reps[D.custRep[c]];
R.forEach(r=>{r.y=+r.d.slice(0,4);r.m=+r.d.slice(5,7);r.ym=r.d.slice(0,7);r.cp=curRep(r.c)});

// ── 날짜
const pad=n=>String(n).padStart(2,'0');
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fd=dt=>dt.toISOString().slice(0,10);
const addD=(s,n)=>{const x=pd(s);x.setUTCDate(x.getUTCDate()+n);return fd(x)};
const days=(a,b)=>Math.round((pd(b)-pd(a))/864e5)+1;
const eom=(y,m)=>fd(new Date(Date.UTC(y,m,0)));
const shiftY=(s,n=-1)=>{let y=+s.slice(0,4)+n,md=s.slice(5);if(md==='02-29')md='02-28';return `${y}-${md}`};
const BY=+MAX.slice(0,4),BM=+MAX.slice(5,7),BD=+MAX.slice(8);
const wk=s=>pd(s).getUTCDay();
function perName(f,t){
  const [fy,fm,fdd]=f.split('-').map(Number),[ty,tm,tdd]=t.split('-').map(Number);
  const yp=(fy===ty&&fy===BY)?'':`${fy}년 `;
  if(f===t)return `${yp}${fm}월 ${fdd}일`;
  const full=fdd===1&&(t===eom(ty,tm)||t===MAX);
  if(full&&fy===ty){
    if(fm===tm)return `${yp}${fm}월`+(t===MAX&&t!==eom(ty,tm)?` (1~${tdd}일)`:'');
    if(fm===1&&tm===12)return `${fy}년 전체`;
    if(fm===1&&t===MAX)return `${yp}누계 (1/1~${tm}/${tdd})`;
    if((fm-1)%3===0&&tm===fm+2)return `${yp}${(fm+2)/3}분기`;
    return `${yp}${fm}~${tm}월`;
  }
  return fy===ty?`${yp}${fm}/${fdd} ~ ${tm}/${tdd}`:`${fy}.${fm}.${fdd} ~ ${ty}.${tm}.${tdd}`;
}
const yoyOf=(f,t)=>{const a=shiftY(f),b=shiftY(t);return a<MIN?null:{f:a,t:b}};

// ── 숫자
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
function amt(n){if(n==null)return '—';const a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e8)return s+(a/1e8).toFixed(a>=1e10?0:a>=1e9?1:2)+'억';
  if(a>=1e4)return s+Math.round(a/1e4).toLocaleString('ko-KR')+'만';
  return a===0?'0':s+Math.round(a).toLocaleString('ko-KR')+'원'}
const nf=n=>n==null?'—':Math.round(n).toLocaleString('ko-KR');
function delta(cur,prev){
  if(prev==null)return{t:'—',c:'flat',p:null};
  if(!prev)return cur>0?{t:'전년 없음',c:'up',p:null}:{t:'—',c:'flat',p:null};
  const p=(cur-prev)/Math.abs(prev)*100;
  if(Math.abs(p)>=999)return{t:(p>0?'▲ ':'▼ ')+'999%+',c:p>0?'up':'down',p};
  if(Math.abs(p)<0.05)return{t:'0%',c:'flat',p};
  return{t:(p>=0?'▲ ':'▼ ')+Math.abs(p).toFixed(Math.abs(p)<10?1:0)+'%',c:p>0.05?'up':p<-0.05?'down':'flat',p};
}
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='style')e.setAttribute('style',v);else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}kids.flat().forEach(k=>k!=null&&k!==false&&e.append(k.nodeType?k:document.createTextNode(k)));return e};
const sum=(rows,f='a')=>{let s=0;for(const r of rows)s+=r[f];return s};
function groupBy(rows,key){const m=new Map();for(const r of rows){const k=typeof key==='function'?key(r):r[key];let o=m.get(k);if(!o){o={k,a:0,q:0,neg:0,n:0,rows:[]};m.set(k,o)}o.a+=r.a;o.q+=r.q;if(r.a<0)o.neg+=r.a;o.n++;o.rows.push(r)}return m}
const inR=(rows,f,t)=>rows.filter(r=>r.d>=f&&r.d<=t);
const dCell=(cur,prev)=>{const x=delta(cur,prev);return el('span',{class:x.c,text:x.t})};
const shareCell=(v,tot)=>{const p=tot?v/tot*100:0;return el('span',{},p.toFixed(1)+'%',el('span',{class:'share'},el('i',{style:`width:${Math.max(0,Math.min(100,p))}%`})))};
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8)}`:'—';

// 주문 주기: 최근 1년 주문일(매출>0) 간격 평균, 1.5배 넘게 주문 없으면 '지연'
function cadence(rows){
  const from=addD(MAX,-364);
  const ds=[...new Set(rows.filter(r=>r.a>0&&r.d>=from).map(r=>r.d))].sort();
  const lastAll=rows.filter(r=>r.a>0).reduce((m,r)=>r.d>m?r.d:m,'');
  const o={n:ds.length,last:lastAll||null,since:lastAll?days(lastAll,MAX)-1:null,gap:null,next:null,late:false};
  if(ds.length>=3){o.gap=Math.round((days(ds[0],ds[ds.length-1])-1)/(ds.length-1));o.next=addD(ds[ds.length-1],o.gap);o.late=o.since>Math.max(o.gap*1.5,o.gap+10)}
  return o;
}

// ── 상태
const S={f:`${BY}-${pad(BM)}-01`,t:MAX,tab:null,q:{}};
const K={D,R,STAFF,curRep,MAX,MIN,BY,BM,BD,S,pad,pd,fd,addD,days,eom,shiftY,perName,yoyOf,won,amt,nf,delta,el,sum,groupBy,inR,dCell,shareCell,md,cadence,page:null};

function periodRow(){
  const row=el('div',{class:'row'},el('span',{class:'lab',text:'기간'}));
  const pm=BM===1?[BY-1,12]:[BY,BM-1];
  const Q=[[`당월 (${BM}월)`,`${BY}-${pad(BM)}-01`,MAX],[`전월 (${pm[1]}월)`,`${pm[0]}-${pad(pm[1])}-01`,eom(pm[0],pm[1])],['금년 누계',`${BY}-01-01`,MAX]];

// ── (가) 매출 증감 요인: 전년 동기 → 물량 → 단가 → 신규 제품 → 판매 중단 → 금년 (품목=시장별 SKU 기준)
function factors(M){
  const y=yoyOf(S.f,S.t);if(!y)return;
  const cur=inR(F(R),S.f,S.t),prev=inR(F(R),y.f,y.t);const A1=sum(cur),A0=sum(prev);
  const g1=groupBy(cur,'i'),g0=groupBy(prev,'i');let vol=0,price=0,neu=0,drop=0,etc=0;
  new Set([...g1.keys(),...g0.keys()]).forEach(k=>{const a=g1.get(k),b=g0.get(k);const q1=a?a.q:0,q0=b?b.q:0,a1=a?a.a:0,a0=b?b.a:0;
    if(q1>0&&q0>0){const p0=a0/q0,p1=a1/q1;vol+=(q1-q0)*p0;price+=(p1-p0)*q1}
    else if(q1>0&&q0<=0&&a0===0)neu+=a1;else if(q0>0&&q1<=0&&a1===0)drop-=a0;else etc+=a1-a0});
  // 평균 단가 변동 (양쪽 모두 판매된 품목)
  let q1s=0,v1=0,v0=0;g1.forEach((o,k)=>{const b=g0.get(k);if(b&&o.q>0&&b.q>0){q1s+=o.q;v1+=o.a;v0+=b.a/b.q*o.q}});
  const pc=v0?(v1-v0)/v0:null;

  if(Math.abs(etc)>=1e4)steps.push(['기타 조정',etc]);steps.push(['금년',A1,'end']);
  const p=K.panel('매출 증감 요인',`${perName(S.f,S.t)} vs 전년 동기 · 시장별 품목 기준`);
  const dx=delta(A1,A0);
  p.append(el('div',{class:'fsum'},el('span',{},'매출 ',el('b',{class:dx.c,text:`${A1-A0>=0?'+':''}${amt(A1-A0)} (${dx.t})`})),
    el('span',{},'물량 효과 ',el('b',{class:vol>=0?'up':'down',text:`${vol>=0?'+':''}${amt(vol)}`})),
    el('span',{},'단가 효과 ',el('b',{class:price>=0?'up':'down',text:`${price>=0?'+':''}${amt(price)}`}),pc!=null?el('span',{class:'note',text:` (평균 단가 ${pc>=0?'+':''}${(pc*100).toFixed(1)}%)`}):null),
    el('span',{},'신규·중단 ',el('b',{class:neu+drop>=0?'up':'down',text:`${neu+drop>=0?'+':''}${amt(neu+drop)}`}))));

    let run=0,vals=[];steps.forEach(([l,v,t])=>{if(t==='base'){vals.push([0,v]);run=v}else if(t==='end')vals.push([0,v]);else{vals.push([run,run+v]);run+=v}});
    const mx=Math.max(1,...vals.flat()),mn=Math.min(0,...vals.flat());
    const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.style.display='block';
    const yy=v=>pt+(H-pt-pb)*(mx-v)/(mx-mn);const mk=(t,a,txt)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.append(e);return e};
    mk('line',{x1:0,x2:W,y1:yy(0),y2:yy(0),stroke:'var(--line)'});
    steps.forEach(([l,v,t],i)=>{const[a,b]=vals[i];const cx=slot*i+slot/2,top=yy(Math.max(a,b)),h=Math.max(1,Math.abs(yy(a)-yy(b)));
      const col=t==='base'?'var(--ghost)':t==='end'?'var(--accent)':v>=0?'var(--up)':'var(--down)';
      const r=mk('rect',{x:cx-bw/2,y:top,width:bw,height:h,fill:col,rx:2,opacity:t?1:.85});
      const tt=document.createElementNS(ns,'title');tt.textContent=`${l} ${won(v)}`;r.append(tt);
      mk('text',{x:cx,y:top-6,'text-anchor':'middle','font-size':12,'font-weight':600,fill:'var(--fg)'},t?amt(v):`${v>=0?'+':''}${amt(v)}`);
      mk('text',{x:cx,y:H-7,'text-anchor':'middle','font-size':12,fill:'var(--muted)'},l);
      if(i<n-1&&!t||t==='base'){const e=t==='base'?b:b;mk('line',{x1:cx+bw/2,x2:cx+slot-bw/2,y1:yy(e),y2:yy(e),stroke:'var(--faint)','stroke-dasharray':'3 3'})}});
    host.append(svg)});
  p.append(el('div',{class:'foot',style:'padding:0 16px 14px',text:'※ 물량 효과 = (금년 수량 − 전년 수량) × 전년 단가, 단가 효과 = (금년 단가 − 전년 단가) × 금년 수량. 두 기간 모두 판매된 품목 기준이며, 한쪽 기간에만 판매된 품목은 신규 제품·판매 중단으로 따로 표시합니다.'}));
  M.append(p);
}
// ── (나) 신규 시장·제품 안착 현황: 금년 최초 주문된 품목(시장별 SKU)

// ══ 시장·품목
function tabItem(M){
  K.lost(M,F(R),{key:'i',name:k=>D.items[k][1],onRow:k=>itemDrawer(k),unitLab:'품목'});
  newLaunch(M);
  const y=yoyOf(S.f,S.t);const Y=+S.t.slice(0,4);const met=S.metric;const fmt=met==='a'?amt:nf;
  const months=[];for(let m=1;m<=12;m++)if(`${Y}-${pad(m)}`<=MAX.slice(0,7))months.push(m);
  const base=F(R,{noMk:true});const yr=base.filter(r=>r.y===Y),pcut=Y===BY?K.shiftY(MAX):`${Y-1}-12-31`,pyr=base.filter(r=>r.y===Y-1&&r.d<=pcut);
  const seg=el('div',{class:'seg'},...[['a','금액'],['q','수량']].map(([k,l])=>el('button',{class:met===k?'on':'',text:l,onclick:()=>{S.metric=k;K.render(true)}})));
  const p=el('section',{class:'panel'},el('h2',{},'시장 × 월',el('span',{class:'sub',text:`${Y}년 · 누계는 전년 같은 날짜까지와 비교`}),el('span',{class:'right'},seg)));

    sumRow:Object.assign({k:'합계',s:fmt(sum(yr,met)),ps:fmt(sum(pyr,met)),ch:dCell(sum(yr,met),sum(pyr,met))},Object.fromEntries(months.map(m=>['m'+m,fmt(sum(yr.filter(r=>r.m===m),met))]))),
    cols:[{k:'k',l:'시장',cls:'name'},...months.map(m=>({k:'m'+m,l:m+'월',n:1,f:r=>r['m'+m]?fmt(r['m'+m]):el('span',{class:'flat',text:'·'})})),{k:'s',l:'누계',n:1,f:r=>fmt(r.s)},{k:'ps',l:'전년 누계',n:1,f:r=>fmt(r.ps)},{k:'ch',l:'증감',n:1,f:r=>dCell(r.s,r.ps),nosort:1}]});
  M.append(p);
  // SKU 표
  const cur=inR(F(R),S.f,S.t),prev=y?inR(F(R),y.f,y.t):null;const im=groupBy(cur,'i'),ipm=prev?groupBy(prev,'i'):null;
  const ids=[...new Set([...im.keys(),...(ipm?ipm.keys():[])])];
  const srows=ids.map(k=>{const it=D.items[k];const o=im.get(k),po=ipm?.get(k);const cad=cadence(F(R).filter(r=>r.i===k));const u=o?unit(o.rows):null,pu=po?unit(po.rows):null;
    return{id:k,name:it[1],mk:it[7],ln:it[8],q:o?.q||0,a:o?.a||0,p:ipm?(po?.a||0):null,u,uc:u&&pu?(u-pu)/pu:null,last:cad.last,since:cad.since,gap:cad.gap,next:cad.next,late:cad.late}});

    table(td,{id:'sku',rows:srows.filter(r=>!k||r.name.toLowerCase().includes(k)||r.mk.includes(k)),maxH:600,sort:{k:'a',d:-1},redraw:draw,onRow:r=>itemDrawer(r.id),
      cols:[{l:'#',f:(r,i)=>i+1,cls:'rk'},{k:'name',l:'품명',cls:'name',title:r=>r.name},{k:'mk',l:'시장'},{k:'q',l:'수량',n:1,f:r=>nf(r.q)},{k:'a',l:'매출',n:1,f:r=>amt(r.a),title:r=>won(r.a)},{k:'p',l:'전년 동기',n:1,f:r=>r.p==null?'—':amt(r.p)},{k:'ch',l:'증감',n:1,f:r=>dCell(r.a,r.p),nosort:1},
        {k:'u',l:'평균 단가',n:1,f:r=>r.u?nf(r.u)+'원':'—'},{k:'uc',l:'단가 변동',n:1,f:r=>r.uc==null?'—':el('span',{class:Math.abs(r.uc)<0.005?'flat':r.uc>0?'up':'down',text:(r.uc>0?'+':'')+(r.uc*100).toFixed(1)+'%'})},
        {k:'since',l:'최종 주문일',n:1,f:r=>r.last?`${r.last.slice(2).replace(/-/g,'.')} (${r.since}일 전)`:'—'},{k:'gap',l:'평균 간격',n:1,f:r=>r.gap?r.gap+'일':'—'},
        {k:'next',l:'차기 발주 예상일',n:1,f:r=>r.next?el('span',{class:r.late?'st-late':'',text:md(r.next)+(r.late?' 지남':'')}):'—'}]})};
  q.oninput=()=>{S.iq=q.value;draw()};draw();M.append(p2);
}

// ══ 주문 내역
function docRows(rows){const dm=groupBy(rows,'doc');return [...dm.values()].map(o=>({doc:o.k,d:o.rows[0].d,c:o.rows[0].c,cust:D.custs[o.rows[0].c],mks:[...new Set(o.rows.map(r=>r.mk))].join(', '),n:o.rows.length,q:o.q,a:o.a,rows:o.rows}))}
function tabOrder(M){
  const y=yoyOf(S.f,S.t);const cur=inR(F(R),S.f,S.t),prev=y?inR(F(R),y.f,y.t):null;
  const docs=docRows(cur),pdocs=prev?docRows(prev):null;const pos=docs.filter(d=>d.a>0);
  const g=el('div',{class:'grid4'});
  const mini=(k,v,d)=>el('div',{class:'card mini static'},el('div',{class:'k',text:k}),el('div',{class:'v',text:v}),el('div',{class:'d'},d||''));
  const avg=pos.length?sum(pos)/pos.length:0,pavg=pdocs&&pdocs.filter(d=>d.a>0).length?sum(pdocs.filter(d=>d.a>0))/pdocs.filter(d=>d.a>0).length:null;
  g.append(mini('주문 전표',nf(docs.length)+'건',pdocs?[dCell(docs.length,pdocs.length),el('span',{class:'flat',text:` 전년 ${pdocs.length}건`})]:null),
    mini('전표당 평균',amt(avg),pavg!=null?[dCell(avg,pavg),el('span',{class:'flat',text:` 전년 ${amt(pavg)}`})]:null),
    mini('가장 큰 주문',pos.length?amt(Math.max(...pos.map(d=>d.a))):'—',el('span',{class:'flat',text:pos.length?md(pos.reduce((m,d)=>d.a>m.a?d:m).d):''})),
    mini('주문한 날',nf(new Set(pos.map(d=>d.d)).size)+'일'));
  M.append(g);
  const p=panel('주문 전표',`${perName(S.f,S.t)} · ※ 행을 클릭하면 품목 내역이 열립니다`);const td=el('div');p.append(td);
  table(td,{id:'docs',rows:docs,maxH:640,sort:{k:'d',d:-1},onRow:r=>docDrawer(r),
    cols:[{k:'d',l:'일자',f:r=>r.d.slice(2).replace(/-/g,'.')},{k:'cust',l:'거래처'},{k:'mks',l:'시장',cls:'name',title:r=>r.mks},{k:'n',l:'품목 수',n:1},{k:'q',l:'수량',n:1,f:r=>nf(r.q)},{k:'a',l:'금액',n:1,f:r=>amt(r.a),title:r=>won(r.a)}]});
  M.append(p);
}

// ── 서랍
function common(dr,all){
  const y=yoyOf(S.f,S.t);const cur=inR(all,S.f,S.t),prev=y?inR(all,y.f,y.t):null;const a=sum(cur),pa=prev?sum(prev):null,dx=delta(a,pa);const cad=cadence(all);
  dr.append(K.stats([[perName(S.f,S.t),amt(a),'',won(a)],['전년 동기 대비',y?dx.t:'—',dx.c],[`${BY}년 누계`,amt(sum(all.filter(r=>r.y===BY)))],[`${BY-1}년 전체`,amt(sum(all.filter(r=>r.y===BY-1)))],
    ['최종 주문일',cad.last?`${md(cad.last)} (${cad.since}일 전)`:'—',cad.late?'st-late':''],['주문 간격 · 차기 발주 예상일',cad.gap?`${cad.gap}일 · ${md(cad.next)}`:'—',cad.late?'st-late':'']]));
  const mp=panel('월별 매출',`${BY}년 vs ${BY-1}년`);mp.append(K.legend([['var(--accent)',`${BY}년`],['var(--ghost)',`${BY-1}년`]]));const mc=el('div',{class:'pb'});mp.append(mc);dr.append(mp);K.monthly2(mc,all);
  return{cur,prev};
}
const docCols=[{k:'d',l:'일자',f:r=>r.d.slice(2).replace(/-/g,'.')},{k:'cust',l:'거래처'},{k:'q',l:'수량',n:1,f:r=>nf(r.q)},{k:'a',l:'금액',n:1,f:r=>amt(r.a),title:r=>won(r.a)}];
function mkDrawer(mk,sel){const all=F(R,{noMk:true}).filter(r=>r.mk===mk);
  K.drawer(`${mk} 시장`,S.cust!==''?D.custs[+S.cust]:'애터미 전체',dr=>{const{cur,prev}=common(dr,all);
    const im=groupBy(cur,'i'),pm=prev?groupBy(prev,'i'):null;const ids=[...new Set([...im.keys(),...(pm?pm.keys():[])])];
    dr.append(K.section(`품목별 (${perName(S.f,S.t)}) · ※ 품목을 클릭하면 이 시장의 월별 매출이 보입니다`,true,b=>table(b,{id:'dmi',maxH:320,sort:{k:'a',d:-1},redraw:()=>mkDrawer(mk,sel),onRow:r=>mkDrawer(mk,sel===r.id?null:r.id),rowCls:r=>r.id===sel?'on':'',
      rows:ids.map(k=>({id:k,name:D.items[k][1],q:im.get(k)?.q||0,a:im.get(k)?.a||0,p:pm?(pm.get(k)?.a||0):null})),
      cols:[{k:'name',l:'품목',cls:'name',title:r=>r.name},{k:'q',l:'수량',n:1,f:r=>nf(r.q)},{k:'a',l:'매출',n:1,f:r=>amt(r.a)},{k:'p',l:'전년 동기',n:1,f:r=>r.p==null?'—':amt(r.p)},{k:'ch',l:'증감',n:1,f:r=>dCell(r.a,r.p),nosort:1}]})));
    if(sel!=null)dr.append(K.selItem(all.filter(r=>r.i===sel),`${mk} · ${D.items[sel][1]}`,()=>mkDrawer(mk),()=>itemDrawer(sel)));
    const docs=docRows(all.filter(r=>r.d>=addD(MAX,-364)));
    dr.append(K.section(`최근 1년 주문 ${docs.length}건`,false,b=>table(b,{id:'dmd',rows:docs,maxH:340,sort:{k:'d',d:-1},redraw:()=>mkDrawer(mk),cols:docCols})));
  })}
function itemDrawer(id){const it=D.items[id];const all=F(R,{noMk:true}).filter(r=>r.i===id);
  K.drawer(it[1],`${it[0]} · ${it[2]} · 시장 ${it[7]}`,dr=>{common(dr,all);
    const docs=docRows(all.filter(r=>r.d>=addD(MAX,-364)));
    dr.append(K.section(`최근 1년 주문 ${docs.length}건`,true,b=>table(b,{id:'did',rows:docs,maxH:380,sort:{k:'d',d:-1},redraw:()=>itemDrawer(id),cols:docCols})));
  })}
function docDrawer(doc){
  K.drawer(`${doc.cust} 주문`,`${doc.d.replace(/-/g,'.')} · 전표 ${D.docs[doc.doc]}`,dr=>{
    dr.append(K.stats([['금액',amt(doc.a),'',won(doc.a)],['수량',nf(doc.q)],['품목 수',doc.n+'개']]));
    const p=panel('품목');const b=el('div');p.append(b);dr.append(p);
    table(b,{id:'ddl',maxH:500,sort:{k:'a',d:-1},redraw:()=>docDrawer(doc),onRow:r=>itemDrawer(r.id),rows:doc.rows.map(r=>({id:r.i,name:D.items[r.i][1],mk:r.mk,q:r.q,a:r.a,u:r.q?r.a/r.q:null})),
      cols:[{k:'name',l:'품목',cls:'name',title:r=>r.name},{k:'mk',l:'시장'},{k:'q',l:'수량',n:1,f:r=>nf(r.q)},{k:'u',l:'단가',n:1,f:r=>r.u?nf(r.u)+'원':'—'},{k:'a',l:'금액',n:1,f:r=>amt(r.a)}]});
  })}
