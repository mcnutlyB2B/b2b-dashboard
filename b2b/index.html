.row .lab{font-size:12px;color:var(--faint);width:44px;flex:none}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1.4}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.x{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
main.wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.panel>h2{font-size:15px;font-weight:600;margin:0;padding:14px 16px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h2 .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.panel>h2 .right{margin-left:auto;display:flex;gap:4px}
.pb{padding:12px 16px 16px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.card:hover{border-color:var(--faint)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.static{cursor:default}.card.static:hover{border-color:var(--line)}
.card .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .v{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.25}
.card.big .v{font-size:26px}
.card .d{font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;gap:6px;flex-wrap:wrap}
.card .bar{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.mini .v{font-size:19px}
/* 진행률 */
.prog{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;padding:12px 16px 16px}
.prog .nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;align-content:start}
.prog .nums small{display:block;color:var(--muted);font-size:12.5px}
.prog .nums b{font-size:20px;font-variant-numeric:tabular-nums}
.prog .nums .hero b{font-size:28px}
.prog .nums .hero b.ly{color:var(--muted)}
.prog .nums .hero .dx{font-size:14px;font-weight:600}
.mini3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini3 small{display:block;color:var(--muted);font-size:12.5px}
.mini3 b{font-size:18px;font-variant-numeric:tabular-nums}
.donut{display:flex;flex-direction:column;gap:10px;min-width:0}
.donut .dh2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.donut .dt{font-size:13px;font-weight:600;color:var(--muted)}
.dbody{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:center}
.dsvg{width:180px;height:180px;display:block}
.dleg{display:flex;flex-direction:column;gap:2px;min-width:0}
.dleg .dr{display:grid;grid-template-columns:10px minmax(0,1fr) 40px 64px 64px;gap:8px;align-items:center;font-size:13px;padding:4px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.dleg .dr.click{cursor:pointer}.dleg .dr.click:hover{background:var(--panel2)}
.dleg .dr.on{background:var(--accent-soft)}
.dleg i{width:10px;height:10px;border-radius:2px}
.dleg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg .pc,.dleg .av,.dleg .dx{text-align:right;white-space:nowrap}
.dleg .pc{color:var(--muted)}.dleg .dx{font-size:12px}
.spark{width:130px;height:30px;display:block}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap}
.st-ok{color:var(--ok)}
.t td.w{white-space:normal;min-width:220px;max-width:340px;color:var(--muted);font-size:12.5px}
.t td.w2{max-width:260px;color:var(--muted);font-weight:400;font-size:12.5px}
.lostsum{display:flex;gap:28px;flex-wrap:wrap;padding:12px 16px 0}
.lostsum small{display:block;color:var(--muted);font-size:12.5px}
.lostsum b{font-size:22px;font-variant-numeric:tabular-nums}
.lostsum span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pbar{position:relative;height:16px;background:var(--chip);border-radius:8px;margin:20px 0 22px;grid-column:1/-1}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:8px}
.pbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);text-decoration:none}
.pbar u span{position:absolute;top:22px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);white-space:nowrap}
.pbar em{position:absolute;right:0;top:-19px;font-size:11.5px;color:var(--muted);font-style:normal;white-space:nowrap}
.pbar u.ly{background:var(--warn)}
.callout{grid-column:1/-1;font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:8px 10px}
.prog .nums .callout b{color:var(--fg);font-size:inherit}
/* 차트 */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar-g.click{cursor:pointer}
.chart .bar-g:hover .cur{opacity:.85}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip .t{font-weight:600;margin-bottom:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:8px 16px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* 표 */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px 0}
.tools input,.tools select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--fg);font:inherit;font-size:13px;min-width:0}
.tools input{width:200px;max-width:100%}
.tw{overflow:auto;margin:10px 0 0;border-top:1px solid var(--line)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.t th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1;font-size:12.5px}
.t th.n,.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.t th .ar{color:var(--accent);margin-left:2px}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--panel2)}
.t td.name{max-width:280px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.t td.rk{color:var(--faint);width:28px}
.t tr.sum td{font-weight:600;background:var(--panel2)}
.t tr.on td{background:var(--accent-soft)}
.share{display:inline-block;width:44px;height:5px;background:var(--chip);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid currentColor;line-height:1.6}
.st-new{color:var(--accent)} .st-up{color:var(--up)} .st-keep{color:var(--muted)} .st-down{color:var(--down)} .st-risk{color:var(--bad)} .st-late{color:var(--warn)} .st-dorm{color:var(--faint)}
.empty{color:var(--muted);padding:28px 16px;text-align:center}
.note{font-size:12.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--faint);line-height:1.6}
.hbar{display:flex;flex-direction:column;gap:4px}
.hbar .hr{display:grid;grid-template-columns:120px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:13px;cursor:pointer;padding:3px 4px;border-radius:6px}

.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.drawer h3{margin:0;font-size:18px}
.drawer .x{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:16px}
.stats6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats6 div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.stats6 small{display:block;color:var(--muted);font-size:12px}
.stats6 b{font-size:16px;font-variant-numeric:tabular-nums}
details.panel summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px}
details.panel[open] summary{border-bottom:1px solid var(--line)}

@media (max-width:1100px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.prog{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  header.top{position:static}
  .row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .row .lab{display:none}
  .grid5,.grid4,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card .v{font-size:19px}.card.big .v{font-size:22px}
  .stats6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .t td.name{max-width:150px;position:sticky;left:0;background:var(--panel);z-index:0}

  .cal .gd{grid-template-columns:repeat(7,minmax(30px,1fr))}

  .dbody{grid-template-columns:minmax(0,1fr)}
  .dsvg{margin:0 auto;width:160px;height:160px}
  .dleg .dr{grid-template-columns:10px minmax(0,1fr) 34px 56px 58px;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

// ── 신호: 최근 12개월, 최근 3개월 vs 작년 같은 3개월, 주문 주기
const D12=addD(MAX,-364),D3=addD(MAX,-90);
K.sig=function(rows){
  const r12=sum(rows.filter(r=>r.d>=D12)),l3=sum(rows.filter(r=>r.d>=D3)),ly3f=shiftY(D3),ly3t=shiftY(MAX);
  const ly3=ly3f>=MIN?sum(inR(rows,ly3f,ly3t)):null;const cad=cadence(rows);
  const ch3=ly3?(l3-ly3)/Math.abs(ly3):null;
  const s={r12,l3,ly3,ch3,cad,tags:[]};
  if(ly3>0&&ch3<=-0.3)s.tags.push(l3<=0?'이탈 위험':'급감');
  if(cad.late)s.tags.push('주문 지연');
  if(cad.next&&!cad.late&&cad.next>=MAX&&cad.next<=addD(MAX,7))s.tags.push('주문 예정');
  if(ly3>0&&ch3>=0.2)s.tags.push('성장');
  return s;
};
const TAGC={'이탈 위험':'st-risk','급감':'st-risk','주문 지연':'st-late','주문 예정':'st-new','성장':'st-ok'};

  const cp=panel('거래처별');const cd=el('div');cp.append(cd);
  table(cd,{id:'retc',rows:[...groupBy(neg,'c').values()].map(o=>({id:o.k,name:D.custs[o.k],a:o.a,n:o.n,rep:K.curRep(o.k)})),sort:{k:'a',d:1},onRow:r=>custDrawer(r.id),maxH:420,
    cols:[{k:'name',l:'거래처',cls:'name'},{k:'rep',l:'담당'},{k:'a',l:'금액',n:1,f:r=>amt(r.a),title:r=>won(r.a)},{k:'n',l:'건수',n:1}]});
  const lp=panel('상세 내역');const ld=el('div');lp.append(ld);
  table(ld,{id:'retl',rows:neg.map(r=>({d:r.d,c:r.c,name:D.custs[r.c],item:D.items[r.i][1],q:r.q,a:r.a})),sort:{k:'d',d:-1},onRow:r=>custDrawer(r.c),maxH:420,
    cols:[{k:'d',l:'일자',f:r=>md(r.d)},{k:'name',l:'거래처',cls:'name',title:r=>r.name},{k:'item',l:'품목',cls:'name',title:r=>r.item},{k:'q',l:'수량',n:1,f:r=>nf(r.q)},{k:'a',l:'금액',n:1,f:r=>amt(r.a),title:r=>won(r.a)}]});
  g2.append(cp,lp);M.append(g2);
}

// ── 서랍
const brk=(rows,prevRows,key,lab,name,onRow)=>{const m=groupBy(rows,key),pm=prevRows?groupBy(prevRows,key):null,tt=sum(rows);
  const keys=new Set([...m.keys(),...(pm?[...pm.keys()]:[])]);
  return{rows:[...keys].map(k=>({id:k,name:name(k),a:m.get(k)?.a||0,q:m.get(k)?.q||0,p:pm?(pm.get(k)?.a||0):null})).filter(r=>r.a||r.p),
    cols:[{k:'name',l:lab,cls:'name',title:r=>r.name},{k:'q',l:'수량',n:1,f:r=>nf(r.q)},{k:'a',l:'매출',n:1,f:r=>amt(r.a),title:r=>won(r.a)},{k:'p',l:'전년 동기',n:1,f:r=>r.p==null?'—':amt(r.p)},{k:'ch',l:'증감',n:1,f:r=>dCell(r.a,r.p),nosort:1},{k:'s',l:'비중',n:1,f:r=>shareCell(r.a,tt),nosort:1}],onRow}};
function docList(rows,nameOf){const dm=groupBy(rows,'doc');return [...dm.values()].map(o=>({d:o.rows[0].d,name:nameOf(o.rows[0]),a:o.a,items:o.rows.map(r=>D.items[r.i][1]).slice(0,3).join(', ')+(o.rows.length>3?` 외 ${o.rows.length-3}`:'')}))}
function common(dr,all,id,kindRows){
  const y=yoyOf(S.f,S.t);const cur=inR(all,S.f,S.t),prev=y?inR(all,y.f,y.t):null;
  const a=sum(cur),pa=prev?sum(prev):null,dx=delta(a,pa);const cad=cadence(all);
  dr.append(K.stats([[perName(S.f,S.t),amt(a),'',won(a)],['전년 동기 대비',y?dx.t:'—',dx.c],[`${BY}년 누계`,amt(sum(all.filter(r=>r.y===BY)))],[`${BY-1}년 전체`,amt(sum(all.filter(r=>r.y===BY-1)))],
    ['마지막 주문',cad.last?`${md(cad.last)} (${cad.since}일 전)`:'—',cad.late?'st-late':''],['주문 간격 · 다음 예상',cad.gap?`${cad.gap}일 · ${md(cad.next)}`:'—',cad.late?'st-late':'']]));
  const mp=panel('월별 매출',`${BY}년 vs ${BY-1}년`);mp.append(K.legend([['var(--accent)',`${BY}년`],['var(--ghost)',`${BY-1}년`]]));const mc=el('div',{class:'pb'});mp.append(mc);dr.append(mp);K.monthly2(mc,all);
  return{cur,prev};
}
function custDrawer(id){const all=R.filter(r=>r.c===id);
  K.drawer(D.custs[id],`${D.types[D.custType[id]]} · 현재 담당 ${K.curRep(id)}`,dr=>{const{cur,prev}=common(dr,all,id);
    const x=brk(cur,prev,'i','품목',k=>D.items[k][1],r=>itemDrawer(r.id));dr.append(K.section(`품목별 (${perName(S.f,S.t)})`,true,b=>table(b,{id:'dci',...x,maxH:320,sort:{k:'a',d:-1},redraw:()=>custDrawer(id)})));
    const sx=brk(cur,prev,'s','사업장',k=>D.subs[k]);if(sx.rows.length>1)dr.append(K.section('사업장별',false,b=>table(b,{id:'dcs',...sx,maxH:320,sort:{k:'a',d:-1},redraw:()=>custDrawer(id)})));
    const docs=docList(all.filter(r=>r.d>=addD(MAX,-364)),r=>D.subs[r.s]);
    dr.append(K.section(`최근 1년 출고 전표 ${docs.length}건`,false,b=>table(b,{id:'dcd',rows:docs,maxH:340,sort:{k:'d',d:-1},redraw:()=>custDrawer(id),cols:[{k:'d',l:'일자',f:r=>r.d.slice(2).replace(/-/g,'.')},{k:'name',l:'사업장',cls:'name',title:r=>r.name},{k:'items',l:'품목',cls:'name',title:r=>r.items},{k:'a',l:'금액',n:1,f:r=>amt(r.a),title:r=>won(r.a)}]})));
  })}
function itemDrawer(id){const it=D.items[id];const all=F(R,{noType:true,noRep:true}).filter(r=>r.i===id);
  K.drawer(it[1],`${it[0]} · ${it[2]} · ${it[4]}/${it[5]}`,dr=>{const{cur,prev}=common(dr,all,id);
    const x=brk(cur,prev,'c','거래처',k=>D.custs[k],r=>custDrawer(r.id));dr.append(K.section(`거래처별 (${perName(S.f,S.t)})`,true,b=>table(b,{id:'dic',...x,maxH:360,sort:{k:'a',d:-1},redraw:()=>itemDrawer(id)})));
  })}
function repDrawer(p){const key=S.basis==='cur'?'cp':'p';const all=F(R,{noRep:true}).filter(r=>r[key]===p);
  K.drawer(p,S.basis==='cur'?'현재 담당 거래처 기준':'전표 담당자 기준',dr=>{const{cur,prev}=common(dr,all,p);
    const x=brk(cur,prev,'c','거래처',k=>D.custs[k],r=>custDrawer(r.id));dr.append(K.section(`거래처별 (${perName(S.f,S.t)})`,true,b=>table(b,{id:'drc',...x,maxH:380,sort:{k:'a',d:-1},redraw:()=>repDrawer(p)})));
    const tx=brk(cur,prev,'t','유형',k=>k);dr.append(K.section('유형별',false,b=>table(b,{id:'drt',...tx,maxH:320,sort:{k:'a',d:-1},redraw:()=>repDrawer(p)})));
  })}

K.start({tabs:[['sales','매출 현황'],['action','영업 액션'],['cust','거래처 관리'],['rep','담당자'],['item','품목'],['ret','반품·차감']],controls,
  draw:(tab,M)=>({sales:tabSales,action:tabAction,cust:tabCust,rep:tabRep,item:tabItem,ret:tabRet})[tab](M)});
})();
</script>
